[pytest]
# Pytest 配置文件

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# 标记定义
markers =
    integration: 需要真实环境的集成测试（如真实 API、NotebookLM Skill）
    slow: 运行时间较长的测试

# 超时配置（需要 pytest-timeout）
# timeout = 300

# 覆盖率配置（需要 pytest-cov）
# --cov=.
# --cov-report=html
# --cov-report=term-missing

# 最小 Python 版本
minversion = 7.0
